[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-academia"
version = "0.1.0"
description = "Un segundo cerebro educativo, local y personal"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.66.1,<1.67",
  "fsrs==6.3.2",
  "pydantic>=2.14,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
academia = "academia.cli:main"

[tool.setuptools.packages.find]
include = ["academia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
